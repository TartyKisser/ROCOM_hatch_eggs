<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>孵蛋预测 - 洛克王国世界工具站</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: rgba(226,232,240,0.9);
            --panel: rgba(255,255,255,0.92);
            --panel-soft: rgba(248,250,252,0.86);
            --shadow: 0 18px 45px rgba(15,23,42,0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 20px;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            background: url('./web_images/bg.jpg') no-repeat center center fixed,
                        linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: cover;
        }

        .container {
            width: 96%;
            max-width: 1280px;
            margin: 0 auto;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 42px 20px 28px;
            color: white;
        }

        .hero-eyebrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.32);
            border-radius: 999px;
            background: rgba(15,23,42,0.22);
            color: rgba(255,255,255,0.9);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .main-title {
            font-size: 2.6rem;
            line-height: 1.12;
            margin-bottom: 10px;
            font-weight: 900;
            text-shadow: 0 4px 18px rgba(15,23,42,0.45);
        }

        .desc-font {
            font-size: 1.05rem;
            color: rgba(255,255,255,0.94);
            text-shadow: 0 2px 8px rgba(15,23,42,0.28);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 42px;
            padding: 10px 16px;
            border: 1px solid rgba(255,255,255,0.48);
            border-radius: 12px;
            background: rgba(255,255,255,0.9);
            color: var(--primary-dark);
            font-size: 0.95rem;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(15,23,42,0.12);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: rgba(99,102,241,0.48);
        }

        .count-pill {
            display: inline-flex;
            align-items: center;
            min-height: 36px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.84);
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .panel {
            background: var(--panel);
            border: 1px solid rgba(255,255,255,0.55);
            border-radius: 18px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .predictor-shell {
            display: grid;
            grid-template-columns: minmax(300px, 0.9fr) minmax(0, 1.6fr);
            gap: 18px;
            align-items: start;
        }

        .controls {
            padding: 18px;
        }

        .field-grid {
            display: grid;
            gap: 12px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.82rem;
            font-weight: 900;
        }

        .number-input {
            width: 100%;
            min-height: 46px;
            padding: 13px 15px;
            border: 2px solid var(--border);
            border-radius: 13px;
            font-size: 1rem;
            color: var(--text);
            background: rgba(255,255,255,0.94);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .number-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            margin-top: 14px;
        }

        .primary-btn {
            color: white;
            border-color: transparent;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        .note-panel {
            margin-top: 14px;
            padding: 14px;
            border: 1px solid rgba(99,102,241,0.16);
            border-radius: 14px;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.78), rgba(248,250,252,0.68)),
                radial-gradient(circle at top right, rgba(236,72,153,0.12), transparent 46%);
            color: var(--text-secondary);
            line-height: 1.65;
            font-size: 0.9rem;
            font-weight: 750;
        }

        .formula-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .formula-item {
            padding: 10px;
            border-radius: 12px;
            background: rgba(255,255,255,0.7);
            border: 1px solid rgba(226,232,240,0.82);
        }

        .formula-title {
            margin-bottom: 4px;
            color: var(--primary-dark);
            font-size: 0.82rem;
            font-weight: 950;
        }

        .formula-copy {
            color: var(--text-secondary);
            font-size: 0.8rem;
            line-height: 1.55;
        }

        .results-panel {
            min-height: 360px;
            padding: 18px;
        }

        .results-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 14px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary-dark);
            font-size: 1.16rem;
            font-weight: 950;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 22px;
            border-radius: 2px;
            background: var(--primary);
        }

        .summary {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 800;
            text-align: right;
        }

        .result-list {
            display: grid;
            gap: 12px;
        }

        .result-card {
            --accent-rgb: 99,102,241;
            display: grid;
            grid-template-columns: 86px minmax(0, 1fr);
            gap: 14px;
            align-items: center;
            padding: 14px;
            border: 1px solid rgba(226,232,240,0.9);
            border-radius: 16px;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.72)),
                radial-gradient(circle at top right, rgba(var(--accent-rgb),0.24), transparent 48%);
            box-shadow: inset 4px 0 0 rgba(var(--accent-rgb),0.58);
        }

        .sprite-image-wrap {
            position: relative;
            width: 86px;
            height: 86px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background:
                radial-gradient(circle, rgba(255,255,255,0.95), rgba(238,242,255,0.72));
            border: 1px solid rgba(226,232,240,0.86);
        }

        .sprite-image {
            width: 78px;
            height: 78px;
            object-fit: contain;
            filter: drop-shadow(0 8px 12px rgba(15,23,42,0.14));
        }

        .result-main {
            min-width: 0;
        }

        .result-title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .family-title {
            color: var(--text);
            font-size: 1.05rem;
            font-weight: 950;
            line-height: 1.35;
        }

        .probability {
            flex: 0 0 auto;
            color: var(--primary-dark);
            font-size: 1.08rem;
            font-weight: 950;
        }

        .score-bar {
            height: 10px;
            margin-bottom: 10px;
            border-radius: 999px;
            background: rgba(226,232,240,0.96);
            overflow: hidden;
        }

        .score-fill {
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .meta-chip {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(99,102,241,0.09);
            color: var(--primary-dark);
            font-size: 0.78rem;
            font-weight: 900;
        }

        .score-details {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .score-detail {
            padding: 8px;
            border-radius: 10px;
            background: rgba(248,250,252,0.82);
            border: 1px solid rgba(226,232,240,0.8);
        }

        .score-label {
            color: var(--text-secondary);
            font-size: 0.74rem;
            font-weight: 900;
            margin-bottom: 3px;
        }

        .score-value {
            color: var(--text);
            font-size: 0.86rem;
            font-weight: 950;
        }

        .empty-state {
            padding: 34px 16px;
            text-align: center;
            color: var(--text-secondary);
            font-weight: 800;
            line-height: 1.75;
        }

        .footer-beian {
            text-align: center;
            margin-top: 40px;
            padding-bottom: 20px;
            font-size: 13px;
        }

        .footer-beian a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s;
        }

        .footer-beian a:hover {
            color: #ffffff;
        }

        @media (max-width: 980px) {
            .predictor-shell {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .main-title {
                font-size: 1.9rem;
            }

            .topbar,
            .results-head,
            .result-title-row {
                align-items: stretch;
                flex-direction: column;
            }

            .summary {
                text-align: left;
            }

            .formula-grid,
            .score-details {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 520px) {
            .action-row,
            .result-card {
                grid-template-columns: 1fr;
            }

            .sprite-image-wrap {
                width: 96px;
                height: 96px;
            }

            .sprite-image {
                width: 88px;
                height: 88px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="hero-eyebrow">EGG PREDICTION</div>
            <h1 class="main-title">孵蛋预测</h1>
            <p class="desc-font">输入精灵蛋尺寸，估算可能孵化出的精灵家族。</p>
        </header>

        <div class="topbar">
            <a class="btn" href="index.html">‹ 返回主页</a>
            <div class="count-pill" id="dataStatus">数据加载中</div>
        </div>

        <main class="predictor-shell">
            <section class="panel controls">
                <div class="field-grid">
                    <label>
                        <span class="input-label">精灵蛋身高 m</span>
                        <input id="heightInput" class="number-input" type="number" min="0" step="0.001" inputmode="decimal" placeholder="例如 0.18">
                    </label>
                    <label>
                        <span class="input-label">精灵蛋体重 kg</span>
                        <input id="weightInput" class="number-input" type="number" min="0" step="0.001" inputmode="decimal" placeholder="例如 0.92">
                    </label>
                </div>

                <div class="action-row">
                    <button id="predictButton" class="btn primary-btn" type="button">查询</button>
                    <button id="clearButton" class="btn" type="button">清空</button>
                </div>

                <div class="note-panel">
                    预测值为基于现有蛋尺寸数据计算的相对概率，并经过 softmax 锐化，不等同于官方孵化概率。
                    <div class="formula-grid">
                        <div class="formula-item">
                            <div class="formula-title">中心贴近</div>
                            <div class="formula-copy">越靠近尺寸区间中心，基础可信度越高。</div>
                        </div>
                        <div class="formula-item">
                            <div class="formula-title">对角线贴近</div>
                            <div class="formula-copy">越靠近左下到右上的尺寸趋势线，匹配越稳定。</div>
                        </div>
                        <div class="formula-item">
                            <div class="formula-title">区间精确</div>
                            <div class="formula-copy">区间越小，被命中的参考价值越高。</div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="panel results-panel">
                <div class="results-head">
                    <h2 class="section-title">预测结果</h2>
                    <div id="resultSummary" class="summary">等待输入尺寸</div>
                </div>
                <div id="resultList" class="result-list">
                    <div class="empty-state">输入身高和体重后开始预测。</div>
                </div>
            </section>
        </main>
    </div>

    <div class="footer-beian">
        <a href="https://beian.mps.gov.cn/#/query/webSearch?code=32058102002843" rel="noreferrer" target="_blank">
            <img src="https://img.alicdn.com/tfs/TB1..50QpXXXXX7XpXXXXXXXXXX-40-40.png" alt="" style="width: 20px; height: 20px;">
            苏公网安备32058102002843号
        </a>
    </div>

    <script>
        const ATTRIBUTE_COLORS = {
            '普通': '#3F89B4',
            '草': '#4EBC73',
            '火': '#DB5525',
            '水': '#6AA9FE',
            '光': '#4FC0FF',
            '地': '#9A7E3F',
            '冰': '#5FADDD',
            '龙': '#ED4962',
            '电': '#E7C506',
            '毒': '#BA62E0',
            '虫': '#9ECE21',
            '武': '#FF9636',
            '翼': '#3EC7CA',
            '萌': '#FC7CAC',
            '幽': '#9446EC',
            '恶': '#CF467A',
            '机械': '#40CBA9',
            '幻': '#9FA7F8'
        };
        const FALLBACK_ATTRIBUTE_COLOR = '#6366f1';
        const EPSILON = 1e-9;
        const SOFTMAX_TEMPERATURE = 0.1;

        let records = [];
        let families = [];
        let medianArea = 1;

        const heightInput = document.getElementById('heightInput');
        const weightInput = document.getElementById('weightInput');
        const predictButton = document.getElementById('predictButton');
        const clearButton = document.getElementById('clearButton');
        const dataStatus = document.getElementById('dataStatus');
        const resultSummary = document.getElementById('resultSummary');
        const resultList = document.getElementById('resultList');

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function numeric(value) {
            const number = Number(value);
            return Number.isFinite(number) ? number : null;
        }

        function percent(value, digits = 1) {
            return `${(value * 100).toFixed(digits)}%`;
        }

        function rangeText(minValue, maxValue, unit) {
            return `${escapeHtml(minValue)} - ${escapeHtml(maxValue)} ${unit}`;
        }

        function firstAttribute(record) {
            return Array.isArray(record.attributes) && record.attributes[0] ? record.attributes[0] : '普通';
        }

        function hexToRgbParts(hex) {
            const value = String(hex || FALLBACK_ATTRIBUTE_COLOR).replace('#', '').padEnd(6, '0').slice(0, 6);
            const red = parseInt(value.slice(0, 2), 16);
            const green = parseInt(value.slice(2, 4), 16);
            const blue = parseInt(value.slice(4, 6), 16);
            return `${red},${green},${blue}`;
        }

        function portraitSmallPath(record) {
            return String(record && record.portrait ? record.portrait : '').replace('/portrait/', '/portrait-small/');
        }

        function familyKey(record) {
            const evolution = Array.isArray(record.evolution) ? record.evolution.filter(Boolean) : [];
            return evolution[0] || record.id;
        }

        function buildFamilies() {
            const byId = new Map(records.map(record => [record.id, record]));
            const grouped = new Map();

            records.forEach(record => {
                const key = familyKey(record);
                if (!grouped.has(key)) {
                    grouped.set(key, []);
                }
                grouped.get(key).push(record);
            });

            families = [...grouped.entries()].map(([key, members]) => {
                const base = byId.get(key) || members[0];
                const sourceWithEgg = members.find(member => member.eggSize) || base;
                const eggSize = sourceWithEgg.eggSize || null;
                if (!eggSize) return null;

                const heightMin = numeric(eggSize.heightMin);
                const heightMax = numeric(eggSize.heightMax);
                const weightMin = numeric(eggSize.weightMin);
                const weightMax = numeric(eggSize.weightMax);
                if ([heightMin, heightMax, weightMin, weightMax].some(value => value === null)) return null;

                const hMin = Math.min(heightMin, heightMax);
                const hMax = Math.max(heightMin, heightMax);
                const wMin = Math.min(weightMin, weightMax);
                const wMax = Math.max(weightMin, weightMax);
                const heightRange = Math.max(hMax - hMin, EPSILON);
                const weightRange = Math.max(wMax - wMin, EPSILON);

                return {
                    key,
                    base,
                    members,
                    name: `${base.title}家族`,
                    heightMin: hMin,
                    heightMax: hMax,
                    weightMin: wMin,
                    weightMax: wMax,
                    heightRange,
                    weightRange,
                    area: heightRange * weightRange,
                    attribute: firstAttribute(base)
                };
            }).filter(Boolean);

            const areas = families.map(family => family.area).filter(area => area > EPSILON).sort((a, b) => a - b);
            if (areas.length) {
                medianArea = areas[Math.floor(areas.length / 2)];
            }
        }

        function clamp(value, minValue, maxValue) {
            return Math.max(minValue, Math.min(maxValue, value));
        }

        function distanceToSegment(px, py, ax, ay, bx, by) {
            const vx = bx - ax;
            const vy = by - ay;
            const wx = px - ax;
            const wy = py - ay;
            const lengthSquared = vx * vx + vy * vy;
            if (lengthSquared <= EPSILON) {
                return Math.hypot(px - ax, py - ay);
            }
            const t = clamp((wx * vx + wy * vy) / lengthSquared, 0, 1);
            const closestX = ax + t * vx;
            const closestY = ay + t * vy;
            return Math.hypot(px - closestX, py - closestY);
        }

        function maxDiagonalDistance(family) {
            const a = distanceToSegment(
                family.heightMin,
                family.weightMax,
                family.heightMin,
                family.weightMin,
                family.heightMax,
                family.weightMax
            );
            const b = distanceToSegment(
                family.heightMax,
                family.weightMin,
                family.heightMin,
                family.weightMin,
                family.heightMax,
                family.weightMax
            );
            return Math.max(a, b, EPSILON);
        }

        function scoreFamily(family, height, weight) {
            if (
                height < family.heightMin || height > family.heightMax ||
                weight < family.weightMin || weight > family.weightMax
            ) {
                return null;
            }

            const centerHeight = (family.heightMin + family.heightMax) / 2;
            const centerWeight = (family.weightMin + family.weightMax) / 2;
            const normalizedHeightDistance = Math.abs(height - centerHeight) / Math.max(family.heightRange / 2, EPSILON);
            const normalizedWeightDistance = Math.abs(weight - centerWeight) / Math.max(family.weightRange / 2, EPSILON);
            const centerScore = Math.exp(-0.5 * (
                normalizedHeightDistance * normalizedHeightDistance +
                normalizedWeightDistance * normalizedWeightDistance
            ));

            const diagonalDistance = distanceToSegment(
                height,
                weight,
                family.heightMin,
                family.weightMin,
                family.heightMax,
                family.weightMax
            );
            const normalizedDiagonalDistance = diagonalDistance / maxDiagonalDistance(family);
            const diagonalScore = Math.exp(-1.6 * normalizedDiagonalDistance * normalizedDiagonalDistance);

            const compactnessScore = clamp(Math.pow(medianArea / Math.max(family.area, EPSILON), 0.35), 0.55, 2.15);
            const rawScore = Math.pow(centerScore, 0.42) *
                Math.pow(diagonalScore, 0.34) *
                Math.pow(compactnessScore, 0.24);

            return {
                ...family,
                centerScore,
                diagonalScore,
                compactnessScore,
                rawScore
            };
        }

        function predict() {
            const height = numeric(heightInput.value);
            const weight = numeric(weightInput.value);

            if (height === null || weight === null || height <= 0 || weight <= 0) {
                resultSummary.textContent = '请输入有效尺寸';
                resultList.innerHTML = '<div class="empty-state">身高和体重都需要填写大于 0 的数字。</div>';
                return;
            }

            const matches = families
                .map(family => scoreFamily(family, height, weight))
                .filter(Boolean);

            if (!matches.length) {
                resultSummary.textContent = '命中 0 个家族';
                resultList.innerHTML = '<div class="empty-state">当前尺寸没有落入任何已知精灵蛋区间。</div>';
                return;
            }

            const probabilities = softmaxScores(matches.map(item => item.rawScore));
            const ranked = matches
                .map((item, index) => ({
                    ...item,
                    probability: probabilities[index] || 0
                }))
                .sort((a, b) => b.probability - a.probability || a.base.number.localeCompare(b.base.number, 'zh-CN'));

            resultSummary.textContent = `命中 ${ranked.length} 个家族`;
            resultList.innerHTML = ranked.map(renderResult).join('');
        }

        function softmaxScores(rawScores) {
            if (!rawScores.length) return [];
            const logits = rawScores.map(score => Math.log(Math.max(score, EPSILON)) / SOFTMAX_TEMPERATURE);
            const maxLogit = Math.max(...logits);
            const expScores = logits.map(logit => Math.exp(logit - maxLogit));
            const total = expScores.reduce((sum, score) => sum + score, 0);
            return total > 0 ? expScores.map(score => score / total) : rawScores.map(() => 1 / rawScores.length);
        }

        function renderResult(item) {
            const accent = hexToRgbParts(ATTRIBUTE_COLORS[item.attribute] || FALLBACK_ATTRIBUTE_COLOR);
            return `
                <article class="result-card" style="--accent-rgb:${escapeHtml(accent)}">
                    <div class="sprite-image-wrap">
                        <img class="sprite-image" src="${escapeHtml(portraitSmallPath(item.base))}" alt="${escapeHtml(item.base.title)}" loading="lazy" onerror="this.style.display='none'">
                    </div>
                    <div class="result-main">
                        <div class="result-title-row">
                            <div>
                                <div class="family-title">${escapeHtml(item.name)}</div>
                                <div class="meta-row">
                                    <span class="meta-chip">NO.${escapeHtml(item.base.number)}</span>
                                    <span class="meta-chip">${escapeHtml(item.attribute)}系</span>
                                    <span class="meta-chip">${item.members.length} 个形态</span>
                                </div>
                            </div>
                            <div class="probability">${percent(item.probability)}</div>
                        </div>
                        <div class="score-bar">
                            <div class="score-fill" style="width:${Math.max(2, item.probability * 100).toFixed(2)}%"></div>
                        </div>
                        <div class="meta-row">
                            <span class="meta-chip">蛋身高 ${rangeText(item.heightMin, item.heightMax, 'm')}</span>
                            <span class="meta-chip">蛋体重 ${rangeText(item.weightMin, item.weightMax, 'kg')}</span>
                        </div>
                        <div class="score-details">
                            <div class="score-detail">
                                <div class="score-label">中心贴近</div>
                                <div class="score-value">${percent(item.centerScore)}</div>
                            </div>
                            <div class="score-detail">
                                <div class="score-label">对角线贴近</div>
                                <div class="score-value">${percent(item.diagonalScore)}</div>
                            </div>
                            <div class="score-detail">
                                <div class="score-label">区间精确</div>
                                <div class="score-value">${item.compactnessScore.toFixed(2)}x</div>
                            </div>
                        </div>
                    </div>
                </article>
            `;
        }

        function clearForm() {
            heightInput.value = '';
            weightInput.value = '';
            resultSummary.textContent = '等待输入尺寸';
            resultList.innerHTML = '<div class="empty-state">输入身高和体重后开始预测。</div>';
            heightInput.focus();
        }

        async function loadHandbook() {
            try {
                const response = await fetch('handbook_data.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                records = data.records || [];
                buildFamilies();
                dataStatus.textContent = `已载入 ${families.length} 个有蛋数据家族`;
            } catch (error) {
                console.error(error);
                dataStatus.textContent = '加载失败';
                resultSummary.textContent = '数据不可用';
                resultList.innerHTML = '<div class="empty-state">请确认 handbook_data.json 存在并可访问。</div>';
            }
        }

        predictButton.addEventListener('click', predict);
        clearButton.addEventListener('click', clearForm);
        [heightInput, weightInput].forEach(input => {
            input.addEventListener('keydown', event => {
                if (event.key === 'Enter') {
                    predict();
                }
            });
        });

        loadHandbook();
    </script>

        var bp = document.createElement('script');
        bp.src = '//push.zhanzhang.baidu.com/push.js';
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(bp, s);
    })();
    </script>
</body>
