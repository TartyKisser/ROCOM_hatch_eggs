            苏公网安备32058102002843号
        </a></div></footer></div></div><script>
        let spriteData = [];
        let selectedSprites = [];
        const backToTop = document.getElementById('backToTop');

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function recordEggGroups(record) {
            return Array.isArray(record.eggGroups)
                ? record.eggGroups.filter(group => group && String(group).toLowerCase() !== 'null')
                : [];
        }

        function portraitSmallPath(record) {
            const portrait = String(record && record.portrait ? record.portrait : '');
            if (portrait) return portrait.replace('/portrait/', '/portrait-small/');
            return `sprite_imgs/portrait-small/${record.id}-portrait.png`;
        }

        function rarePortraitSmallPath(record) {
            return String(record && record.rarePath ? record.rarePath : '').replace('/portrait/', '/portrait-small/');
        }

        function eggGroupLabel(eggGroups) {
            return eggGroups.length ? eggGroups.join('、') : '无';
        }

        function spriteInputLabel(sprite) {
            return `${sprite.name}｜蛋组: ${eggGroupLabel(sprite.eggGroups)}`;
        }

        function spriteSearchText(sprite) {
            return `${sprite.name}${sprite.number || ''}${sprite.id || ''}${eggGroupLabel(sprite.eggGroups)}`.toLowerCase();
        }

        function baseSpriteFromRecord(record) {
            const eggGroups = recordEggGroups(record);
            return {
                id: record.id,
                number: record.number,
                name: record.title,
                imagePath: portraitSmallPath(record),
                fallbackImagePath: '',
                numberedImagePath: '',
                eggGroups
            };
        }

        async function loadSpriteData() {
            try {
                const response = await fetch('handbook_data.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const records = Array.isArray(data.records) ? data.records : [];

                spriteData = records.flatMap(record => {
                    const baseSprite = baseSpriteFromRecord(record);
                    if (baseSprite.eggGroups.length === 0) return [];

                    const sprites = [baseSprite];
                    if (record.rare && record.rarePath) {
                        const rareSmallPath = rarePortraitSmallPath(record);
                        sprites.push({
                            ...baseSprite,
                            id: `${record.id}-rare`,
                            name: `${record.title}异色`,
                            imagePath: rareSmallPath || record.rarePath,
                            fallbackImagePath: record.rarePath
                        });
                    }
                    return sprites;
                });
            } catch (error) {
                console.error('加载数据失败:', error);
            }
        }

        function createSpriteInputs(count) {
            const container = document.getElementById('spriteInputs');
            container.innerHTML = '';
            selectedSprites = [];

            for (let i = 0; i < count; i++) {
                // 增加了 id 字段用于调用图片
                selectedSprites.push({ id: '', name: '', imagePath: '', fallbackImagePath: '', numberedImagePath: '', gender: 'male', eggGroups: [] });

                const row = document.createElement('div');
                row.className = 'sprite-row';
                row.innerHTML = `
                    <div class="sprite-number">${i + 1}</div>
                    <div class="autocomplete-container">
                        <label for="spriteName${i}">精灵名称</label>
                        <span class="sprite-name-field"></span>
                        <div class="autocomplete-list" id="autocomplete${i}"></div>
                    </div>
                    <div>
                        <label>性别</label>
                        <div class="gender-select">
                            <label class="gender-option male active" onclick="selectGender(${i}, 'male')">
                                <input type="radio" name="gender${i}" value="male" checked>
                                <span>♂ 雄性</span>
                            </label>
                            <label class="gender-option female" onclick="selectGender(${i}, 'female')">
                                <input type="radio" name="gender${i}" value="female">
                                <span>♀ 雌性</span>
                            </label>
                        </div>
                    </div>
                `;
                const field = document.getElementById('spriteNameField').content.cloneNode(true);
                const nameInput = field.querySelector('input');
                nameInput.id = `spriteName${i}`;
                nameInput.removeAttribute('aria-label');
                row.querySelector('.sprite-name-field').replaceWith(field);
                container.appendChild(row);

                setupAutocomplete(i);
            }
        }

        function selectGender(index, gender) {
            selectedSprites[index].gender = gender;
            const row = document.querySelectorAll('.sprite-row')[index];
            const options = row.querySelectorAll('.gender-option');
            options.forEach(opt => opt.classList.remove('active'));
            row.querySelector(`.gender-option.${gender}`).classList.add('active');
        }

        function setupAutocomplete(index) {
            const input = document.getElementById(`spriteName${index}`);
            const list = document.getElementById(`autocomplete${index}`);

            input.addEventListener('input', function() {
                const value = this.value.toLowerCase().trim();
                list.innerHTML = '';
                selectedSprites[index].id = '';
                selectedSprites[index].name = '';
                selectedSprites[index].imagePath = '';
                selectedSprites[index].fallbackImagePath = '';
                selectedSprites[index].numberedImagePath = '';
                selectedSprites[index].eggGroups = [];

                if (value.length === 0) {
                    list.style.display = 'none';
                    return;
                }

                const matches = spriteData.filter(s => spriteSearchText(s).includes(value));

                if (matches.length === 0) {
                    list.style.display = 'none';
                    return;
                }

                matches.forEach(sprite => {
                    const item = document.createElement('div');
                    item.className = 'autocomplete-item';
                    item.innerHTML = `
                        <div>${sprite.name}</div>
                        <div class="egg-groups">蛋组: ${eggGroupLabel(sprite.eggGroups)}</div>
                    `;
                    item.addEventListener('click', function() {
                        input.value = spriteInputLabel(sprite);
                        // 保存选中精灵的 ID
                        selectedSprites[index].id = sprite.id; 
                        selectedSprites[index].name = sprite.name;
                        selectedSprites[index].imagePath = sprite.imagePath;
                        selectedSprites[index].fallbackImagePath = sprite.fallbackImagePath;
                        selectedSprites[index].numberedImagePath = sprite.numberedImagePath;
                        selectedSprites[index].eggGroups = sprite.eggGroups;
                        list.style.display = 'none';
                    });
                    list.appendChild(item);
                });

                list.style.display = 'block';
            });

            input.addEventListener('blur', function() {
                setTimeout(() => {
                    list.style.display = 'none';
                }, 200);
            });

            input.addEventListener('focus', function() {
                if (this.value.trim().length > 0) {
                    const event = new Event('input');
                    this.dispatchEvent(event);
                }
            });
        }

        function canBreed(sprite1, sprite2) {
            if (sprite1.gender === sprite2.gender) return false;

            const groups1 = sprite1.eggGroups;
            const groups2 = sprite2.eggGroups;

            if (groups1.length === 0 || groups2.length === 0) return false;

            return groups1.some(g => groups2.includes(g));
        }

        function manhattanDistance(pos1, pos2) {
            const center1 = { x: pos1.x + 1, y: pos1.y + 1 };
            const center2 = { x: pos2.x + 1, y: pos2.y + 1 };
            return Math.abs(center1.x - center2.x) + Math.abs(center1.y - center2.y);
        }

        function findOptimalLayout() {
            const n = selectedSprites.length;
            if (n === 0) return [];
            if (n === 1) return [{x: 0, y: 0}];

            const compatible = new Array(n).fill(0).map(() => new Array(n).fill(false));
            for (let i = 0; i < n; i++) {
                for (let j = i + 1; j < n; j++) {
                    compatible[i][j] = canBreed(selectedSprites[i], selectedSprites[j]);
                    compatible[j][i] = compatible[i][j];
                }
            }

            function isOverlap(x1, y1, x2, y2) {
                return Math.abs(x1 - x2) < 2 && Math.abs(y1 - y2) < 2;
            }

            const searchOffsets = [];
            for (let dx = -6; dx <= 6; dx++) {
                for (let dy = -6; dy <= 6; dy++) {
                    if (Math.abs(dx) >= 2 || Math.abs(dy) >= 2) {
                        if (Math.abs(dx) + Math.abs(dy) <= 6) {
                            searchOffsets.push({dx, dy});
                        }
                    }
                }
            }

            function evaluate(layout) {
                let pairs = 0;
                let compactness = 0;
                for (let i = 0; i < n; i++) {
                    for (let j = i + 1; j < n; j++) {
                        const dist = Math.abs(layout[i].x - layout[j].x) + Math.abs(layout[i].y - layout[j].y);
                        if (dist <= 5 && compatible[i][j]) pairs++;
                        compactness += dist;
                    }
                }
                return { pairs, compactness };
            }

            function getValidEmpties(layout, excludeIdx) {
                const candidates = new Set();
                const currentLen = layout.length;

                for (let i = 0; i < currentLen; i++) {
                    if (i === excludeIdx) continue;
                    for (let off of searchOffsets) {
                        const nx = layout[i].x + off.dx;
                        const ny = layout[i].y + off.dy;
                        
                        let valid = true;
                        for (let j = 0; j < currentLen; j++) { 
                            if (j === excludeIdx) continue;
                            if (isOverlap(nx, ny, layout[j].x, layout[j].y)) {
                                valid = false;
                                break;
                            }
                        }
                        if (valid) {
                            candidates.add(`${nx},${ny}`);
                        }
                    }
                }
                return Array.from(candidates).map(str => {
                    const parts = str.split(',');
                    return {x: parseInt(parts[0]), y: parseInt(parts[1])};
                });
            }

            function getInitialLayout() {
                const layout = [{x: 0, y: 0}];
                while(layout.length < n) {
                    const empties = getValidEmpties(layout, -1);
                    const pick = empties[Math.floor(Math.random() * empties.length)];
                    layout.push({x: pick.x, y: pick.y});
                }
                return layout;
            }

            let globalBestLayout = null;
            let globalBestPairs = -1;
            let globalBestCompactness = Infinity;

            const RESTARTS = 25; 
            const ITERATIONS = 8000; 

            for(let r = 0; r < RESTARTS; r++) {
                let current = getInitialLayout();
                let ev = evaluate(current);
                let currentPairs = ev.pairs;
                let currentComp = ev.compactness;

                let temp = 200.0; 
                const cooling = Math.pow(0.1 / temp, 1.0 / ITERATIONS); 

                for(let i = 0; i < ITERATIONS; i++) {
                    const moveType = Math.random() < 0.5 ? 'swap' : 'move';
                    
                    if (moveType === 'swap') {
                        const idx1 = Math.floor(Math.random() * n);
                        const idx2 = Math.floor(Math.random() * n);
                        if (idx1 !== idx2) {
                            const tempX = current[idx1].x;
                            const tempY = current[idx1].y;
                            current[idx1].x = current[idx2].x;
                            current[idx1].y = current[idx2].y;
                            current[idx2].x = tempX;
                            current[idx2].y = tempY;

                            const newEv = evaluate(current);
                            const deltaPairs = newEv.pairs - currentPairs;
                            const deltaComp = currentComp - newEv.compactness; 
                            
                            const deltaScore = deltaPairs * 100 + deltaComp;

                            if (deltaScore > 0 || Math.random() < Math.exp(deltaScore / temp)) {
                                currentPairs = newEv.pairs;
                                currentComp = newEv.compactness;
                            } else {
                                current[idx2].x = current[idx1].x;
                                current[idx2].y = current[idx1].y;
                                current[idx1].x = tempX;
                                current[idx1].y = tempY;
                            }
                        }
                    } else {
                        const idx = Math.floor(Math.random() * n);
                        const empties = getValidEmpties(current, idx);
                        if (empties.length > 0) {
                            const pick = empties[Math.floor(Math.random() * empties.length)];
                            const oldX = current[idx].x;
                            const oldY = current[idx].y;
                            
                            current[idx].x = pick.x;
                            current[idx].y = pick.y;

                            const newEv = evaluate(current);
                            const deltaPairs = newEv.pairs - currentPairs;
                            const deltaComp = currentComp - newEv.compactness;
                            const deltaScore = deltaPairs * 100 + deltaComp;

                            if (deltaScore > 0 || Math.random() < Math.exp(deltaScore / temp)) {
                                currentPairs = newEv.pairs;
                                currentComp = newEv.compactness;
                            } else {
                                current[idx].x = oldX;
                                current[idx].y = oldY;
                            }
                        }
                    }

                    if (currentPairs > globalBestPairs || (currentPairs === globalBestPairs && currentComp < globalBestCompactness)) {
                        globalBestPairs = currentPairs;
                        globalBestCompactness = currentComp;
                        globalBestLayout = current.map(p => ({x: p.x, y: p.y}));
                    }

                    temp *= cooling;
                }
            }

            return globalBestLayout;
        }

        function generateOptimalLayout() {
            // 1. 强制同步所有输入框的最新状态
            for (let i = 0; i < selectedSprites.length; i++) {
                const input = document.getElementById(`spriteName${i}`);
                const inputValue = input.value.trim();

                if (inputValue) {
                    const current = selectedSprites[i];
                    const isCurrentSelection = current.id && inputValue === spriteInputLabel(current);
                    const found = isCurrentSelection
                        ? current
                        : spriteData.find(s => s.name === inputValue || spriteInputLabel(s) === inputValue);
                    if (found) {
                        selectedSprites[i].id = found.id;
                        selectedSprites[i].name = found.name;
                        selectedSprites[i].imagePath = found.imagePath;
                        selectedSprites[i].fallbackImagePath = found.fallbackImagePath;
                        selectedSprites[i].numberedImagePath = found.numberedImagePath;
                        selectedSprites[i].eggGroups = found.eggGroups;
                    } else {
                        // 如果查不到（可能是用户乱敲的），清空内部状态以便后续报错拦截
                        selectedSprites[i].id = '';
                        selectedSprites[i].name = '';
                        selectedSprites[i].imagePath = '';
                        selectedSprites[i].fallbackImagePath = '';
                        selectedSprites[i].numberedImagePath = '';
                        selectedSprites[i].eggGroups = [];
                    }
                } else {
                    selectedSprites[i].id = '';
                    selectedSprites[i].name = '';
                    selectedSprites[i].imagePath = '';
                    selectedSprites[i].fallbackImagePath = '';
                    selectedSprites[i].numberedImagePath = '';
                    selectedSprites[i].eggGroups = [];
                }
            }

            // 2. 校验表单是否合法
            const invalid = selectedSprites.some((s, i) => {
                if (!s.name) {
                    alert(`请正确填写第 ${i + 1} 个精灵的名称`);
                    return true;
                }
                if (s.eggGroups.length === 0) {
                    alert(`第 ${i + 1} 个精灵 "${s.name}" 没有有效的蛋组信息，请从下拉提示中选择`);
                    return true;
                }
                return false;
            });

            if (invalid) return;

            // 3. 执行排布算法
            const layout = findOptimalLayout();

            if (!layout || layout.length === 0) {
                alert('无法找到有效的排布方案，请检查输入');
                return;
            }

            // 4. 渲染结果
            displayResult(layout);
        }

        function displayResult(layout) {
            const outputSection = document.getElementById('outputSection');
            outputSection.style.display = 'block';

            const gridDisplay = document.getElementById('gridDisplay');
            gridDisplay.innerHTML = '';

            let minX = Infinity, minY = Infinity;
            let maxX = -Infinity, maxY = -Infinity;

            layout.forEach(pos => {
                if (pos.x < minX) minX = pos.x;
                if (pos.y < minY) minY = pos.y;
                if (pos.x > maxX) maxX = pos.x;
                if (pos.y > maxY) maxY = pos.y;
            });

            const cols = maxX - minX + 2;
            const rows = maxY - minY + 2;

            gridDisplay.style.setProperty('--cols', cols);
            gridDisplay.style.setProperty('--rows', rows);

            const pairs = [];
            for (let i = 0; i < selectedSprites.length; i++) {
                for (let j = i + 1; j < selectedSprites.length; j++) {
                    if (canBreed(selectedSprites[i], selectedSprites[j])) {
                        const dist = manhattanDistance(layout[i], layout[j]);
                        if (dist <= 5) {
                            pairs.push([i, j]);
                        }
                    }
                }
            }

            // --- 修改点：渲染带图片的格子 ---
            layout.forEach((pos, index) => {
                const sprite = selectedSprites[index];
                const nest = document.createElement('div');
                nest.className = 'nest-block';
                
                const startCol = pos.x - minX + 1;
                const startRow = pos.y - minY + 1;
                
                nest.style.gridColumn = `${startCol} / span 2`;
                nest.style.gridRow = `${startRow} / span 2`;

                if (sprite.gender === 'male') {
                    nest.classList.add('male-nest');
                } else {
                    nest.classList.add('female-nest');
                }

                const imagePath = sprite.imagePath || '';
                const fallbackImagePath = sprite.fallbackImagePath || '';
                const numberedImagePath = sprite.numberedImagePath || '';

                // 写入数字角标和中心小图，精确形态缺失时回退到同编号默认小图。
                nest.innerHTML = `
                    <span class="nest-badge">${index + 1}</span>
                    <img class="nest-sprite-img" src="${escapeHtml(imagePath)}" data-fallback="${escapeHtml(fallbackImagePath)}" data-numbered-fallback="${escapeHtml(numberedImagePath)}" alt="${escapeHtml(sprite.name)}" onerror="if (this.dataset.fallback && this.src !== new URL(this.dataset.fallback, document.baseURI).href) { this.src = this.dataset.fallback; this.dataset.fallback = ''; } else if (this.dataset.numberedFallback) { this.src = this.dataset.numberedFallback; this.dataset.numberedFallback = ''; } else { this.style.display='none'; }">
                `;

                gridDisplay.appendChild(nest);
            });

            document.getElementById('pairCount').textContent = pairs.length;
            document.getElementById('pathCount').textContent = pairs.length;

            const pathsContainer = document.getElementById('pathsContainer');
            pathsContainer.innerHTML = '';

            if (pairs.length === 0) {
                pathsContainer.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">没有可配对的精灵</p>';
            } else {
                pairs.forEach(([i, j]) => {
                    const sprite1 = selectedSprites[i];
                    const sprite2 = selectedSprites[j];
                    const pathItem = document.createElement('div');
                    pathItem.className = 'path-item';
                    pathItem.innerHTML = `
                        <span style="font-weight: bold;">${i + 1}. ${sprite1.name}</span>
                        <span style="color: ${sprite1.gender === 'male' ? 'var(--male)' : 'var(--female)'};">
                            ${sprite1.gender === 'male' ? '♂' : '♀'}
                        </span>
                        <span class="path-arrow">→</span>
                        <span style="font-weight: bold;">${j + 1}. ${sprite2.name}</span>
                        <span style="color: ${sprite2.gender === 'male' ? 'var(--male)' : 'var(--female)'};">
                            ${sprite2.gender === 'male' ? '♂' : '♀'}
                        </span>
                    `;
                    pathsContainer.appendChild(pathItem);
                });
            }

            outputSection.scrollIntoView({ behavior: 'smooth' });
        }

        document.getElementById('nestCount').addEventListener('change', function() {
            const backupData = selectedSprites.map((sprite, i) => {
                const input = document.getElementById(`spriteName${i}`);
                return {
                    id: sprite.id, // 保留备份 ID
                    name: sprite.name,
                    inputValue: input ? input.value : spriteInputLabel(sprite),
                    imagePath: sprite.imagePath,
                    fallbackImagePath: sprite.fallbackImagePath,
                    numberedImagePath: sprite.numberedImagePath,
                    gender: sprite.gender,
                    eggGroups: sprite.eggGroups
                };
            });

            const newCount = parseInt(this.value);
            createSpriteInputs(newCount);

            for (let i = 0; i < Math.min(newCount, backupData.length); i++) {
                const input = document.getElementById(`spriteName${i}`);
                if(input && backupData[i].name) {
                    input.value = backupData[i].inputValue || spriteInputLabel(backupData[i]);
                    selectedSprites[i].id = backupData[i].id; // 恢复 ID
                    selectedSprites[i].name = backupData[i].name;
                    selectedSprites[i].imagePath = backupData[i].imagePath;
                    selectedSprites[i].fallbackImagePath = backupData[i].fallbackImagePath;
                    selectedSprites[i].numberedImagePath = backupData[i].numberedImagePath;
                    selectedSprites[i].eggGroups = backupData[i].eggGroups;
                }
                selectGender(i, backupData[i].gender);
            }
        });

        function applyImportedSprite(index, sprite) {
            const input = document.getElementById(`spriteName${index}`);
            if (!input) return;

            input.value = spriteInputLabel(sprite);
            selectedSprites[index].id = sprite.id;
            selectedSprites[index].name = sprite.name;
            selectedSprites[index].imagePath = sprite.imagePath;
            selectedSprites[index].fallbackImagePath = sprite.fallbackImagePath;
            selectedSprites[index].numberedImagePath = sprite.numberedImagePath;
            selectedSprites[index].eggGroups = sprite.eggGroups;
            selectedSprites[index].gender = 'male';
            selectGender(index, 'male');
        }

        function importPairSelectionFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const rawPair = params.get('pair');
            if (!rawPair) return false;

            const importedSprites = rawPair
                .split(',')
                .map(id => spriteData.find(sprite => sprite.id === id))
                .filter(Boolean)
                .slice(0, 10);

            if (!importedSprites.length) return false;

            const count = Math.max(2, importedSprites.length);
            document.getElementById('nestCount').value = String(count);
            createSpriteInputs(count);
            importedSprites.forEach((sprite, index) => applyImportedSprite(index, sprite));
            return true;
        }

        loadSpriteData().then(() => {
            if (!importPairSelectionFromUrl()) {
                createSpriteInputs(2);
            }
        });

        function syncBackToTop() {
            backToTop.classList.toggle('is-visible', window.scrollY > 320);
        }

        backToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        window.addEventListener('scroll', syncBackToTop, { passive: true });
        syncBackToTop();
