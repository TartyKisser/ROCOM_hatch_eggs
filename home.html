<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家园查询 - 洛克王国世界工具站</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: rgba(226,232,240,0.9);
            --panel: rgba(255,255,255,0.92);
            --panel-soft: rgba(248,250,252,0.86);
            --shadow: 0 18px 45px rgba(15, 23, 42, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 20px;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            background: url('./web_images/bg.jpg') no-repeat center center fixed,
                        linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: cover;
        }

        .container {
            width: 96%;
            max-width: 1420px;
            margin: 0 auto;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 42px 20px 28px;
            color: white;
        }

        .hero-eyebrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.32);
            border-radius: 999px;
            background: rgba(15,23,42,0.22);
            color: rgba(255,255,255,0.9);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .main-title {
            font-size: 2.6rem;
            line-height: 1.12;
            margin-bottom: 10px;
            font-weight: 900;
            text-shadow: 0 4px 18px rgba(15,23,42,0.45);
        }

        .desc-font {
            font-size: 1.05rem;
            color: rgba(255,255,255,0.94);
            text-shadow: 0 2px 8px rgba(15,23,42,0.28);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 42px;
            padding: 10px 16px;
            border: 1px solid rgba(255,255,255,0.48);
            border-radius: 12px;
            background: rgba(255,255,255,0.9);
            color: var(--primary-dark);
            font-size: 0.95rem;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(15,23,42,0.12);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: rgba(99,102,241,0.48);
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.62;
            transform: none;
        }

        .primary-btn {
            color: white;
            border-color: transparent;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        .count-pill {
            display: inline-flex;
            align-items: center;
            min-height: 36px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.84);
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .panel {
            background: var(--panel);
            border: 1px solid rgba(255,255,255,0.55);
            border-radius: 18px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .controls {
            padding: 18px;
            margin-bottom: 18px;
        }

        .search-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 12px;
            align-items: center;
        }

        .search-input {
            width: 100%;
            min-height: 46px;
            padding: 13px 15px;
            border: 2px solid var(--border);
            border-radius: 13px;
            font-size: 1rem;
            color: var(--text);
            background: rgba(255,255,255,0.94);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
        }

        .error {
            display: none;
            margin-bottom: 18px;
            padding: 13px 15px;
            border: 1px solid rgba(239,68,68,0.26);
            border-radius: 14px;
            background: rgba(254,242,242,0.92);
            color: #b91c1c;
            line-height: 1.65;
            font-weight: 850;
        }

        .summary {
            display: none;
            grid-template-columns: minmax(0, 1fr);
            gap: 18px;
            align-items: center;
            padding: 18px;
            margin-bottom: 18px;
        }

        .summary.active {
            display: grid;
        }

        .home-title {
            margin-bottom: 6px;
            color: var(--text);
            font-size: 1.45rem;
            line-height: 1.25;
            font-weight: 950;
        }

        .home-meta {
            color: var(--text-secondary);
            font-size: 0.88rem;
            font-weight: 850;
        }

        .stats-grid {
            display: none;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .stats-grid.active {
            display: grid;
        }

        .stat-card {
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--panel-soft);
            box-shadow: 0 12px 28px rgba(15,23,42,0.09);
        }

        .stat-label {
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 850;
        }

        .stat-value {
            color: var(--text);
            font-size: 1.26rem;
            font-weight: 950;
        }

        .content-grid {
            display: none;
            grid-template-columns: minmax(0, 1.35fr) minmax(340px, 0.85fr);
            gap: 18px;
            align-items: stretch;
        }

        .content-grid.active {
            display: grid;
        }

        .section {
            padding: 18px;
        }

        .resident-section {
            display: flex;
            min-height: 0;
            flex-direction: column;
        }

        .resident-section #residentsContent {
            display: flex;
            flex: 1;
            min-height: 0;
            flex-direction: column;
        }

        .section + .section {
            margin-top: 18px;
        }

        .side-column {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            gap: 18px;
            height: 100%;
            min-height: 0;
        }

        .side-column .section {
            min-height: 0;
        }

        .side-column .section + .section {
            margin-top: 0;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            color: var(--primary-dark);
            font-size: 1.14rem;
            font-weight: 950;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 22px;
            border-radius: 2px;
            background: var(--primary);
        }

        .pet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .resident-section .pet-grid {
            flex: 1;
            height: 100%;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: repeat(5, minmax(104px, 1fr));
            gap: 14px;
        }

        .side-column .pet-grid {
            grid-template-columns: 1fr;
        }

        .pet-card {
            display: grid;
            grid-template-columns: 68px minmax(0, 1fr);
            gap: 10px;
            padding: 12px;
            border: 1px solid rgba(226,232,240,0.9);
            border-radius: 16px;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.72)),
                radial-gradient(circle at top right, rgba(99,102,241,0.14), transparent 48%);
        }

        .resident-section .pet-card {
            grid-template-columns: 84px minmax(0, 1fr);
            align-items: center;
            gap: 14px;
            padding: 14px;
        }

        .pet-image-wrap {
            position: relative;
            width: 68px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(238,242,255,0.72));
            border: 1px solid rgba(226,232,240,0.86);
        }

        .resident-section .pet-image-wrap {
            width: 84px;
            height: 84px;
            border-radius: 18px;
        }

        .pet-image {
            width: 62px;
            height: 62px;
            object-fit: contain;
            filter: drop-shadow(0 8px 12px rgba(15,23,42,0.14));
        }

        .resident-section .pet-image {
            width: 78px;
            height: 78px;
        }

        .mutation-badge {
            position: absolute;
            top: -7px;
            left: -7px;
            width: 24px;
            height: 24px;
            object-fit: contain;
            filter: drop-shadow(0 5px 8px rgba(15,23,42,0.22));
            pointer-events: none;
        }

        .pet-name-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
        }

        .pet-name {
            min-width: 0;
            color: var(--text);
            font-size: 1rem;
            line-height: 1.35;
            font-weight: 950;
        }

        .pet-mini-meta {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            flex: 0 0 auto;
            color: var(--primary-dark);
            font-size: 0.78rem;
            font-weight: 950;
        }

        .gender-symbol {
            font-size: 1rem;
            line-height: 1;
            font-weight: 950;
        }

        .gender-male {
            color: #2563eb;
        }

        .gender-female {
            color: #db2777;
        }

        .pet-sub {
            margin: 4px 0 8px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            line-height: 1.45;
            font-weight: 800;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            min-height: 22px;
            padding: 3px 7px;
            border-radius: 999px;
            background: rgba(99,102,241,0.09);
            color: var(--primary-dark);
            font-size: 0.74rem;
            font-weight: 900;
        }

        .chip img {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        .type-logo-chip {
            width: 22px;
            height: 22px;
            min-height: 22px;
            padding: 2px;
            justify-content: center;
            background: rgba(255,255,255,0.78);
            border: 1px solid rgba(226,232,240,0.86);
        }

        .type-logo-chip img {
            width: 18px;
            height: 18px;
        }

        .egg-group-chip {
            color: #1d4ed8;
            background: rgba(37,99,235,0.1);
        }

        .alert-chip {
            color: #be185d;
            background: rgba(236,72,153,0.1);
        }

        .farm-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px;
        }

        .side-column .farm-grid {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .plant-card {
            min-height: 122px;
            padding: 10px;
            border: 1px solid rgba(226,232,240,0.9);
            border-radius: 14px;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.72)),
                radial-gradient(circle at top right, rgba(34,197,94,0.18), transparent 48%);
            text-align: center;
        }

        .plant-card.ripe {
            border-color: rgba(34,197,94,0.42);
            box-shadow: inset 0 0 0 2px rgba(34,197,94,0.12);
        }

        .plant-image {
            width: 64px;
            height: 64px;
            object-fit: contain;
            filter: drop-shadow(0 8px 12px rgba(15,23,42,0.12));
        }

        .plant-name {
            overflow: hidden;
            margin-top: 5px;
            color: var(--text);
            font-size: 0.82rem;
            font-weight: 950;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .plant-status {
            margin-top: 3px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 850;
        }

        .plant-status.ripe-text {
            color: #dc2626;
            font-weight: 950;
        }

        .empty-state {
            padding: 34px 16px;
            text-align: center;
            color: var(--text-secondary);
            font-weight: 800;
            line-height: 1.75;
        }

        .footer-beian {
            text-align: center;
            margin-top: 40px;
            padding-bottom: 20px;
            font-size: 13px;
        }

        .footer-beian a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s;
        }

        .footer-beian a:hover {
            color: #ffffff;
        }

        @media (max-width: 1120px) {
            .stats-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .content-grid {
                grid-template-columns: 1fr;
                align-items: start;
            }

            .resident-section {
                display: block;
            }

            .resident-section #residentsContent {
                display: block;
                flex: initial;
            }

            .resident-section .pet-grid {
                height: auto;
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                grid-template-rows: auto;
                gap: 12px;
            }

            .resident-section .pet-card {
                grid-template-columns: 68px minmax(0, 1fr);
                align-items: initial;
                gap: 10px;
                padding: 12px;
            }

            .resident-section .pet-image-wrap {
                width: 68px;
                height: 68px;
                border-radius: 16px;
            }

            .resident-section .pet-image {
                width: 62px;
                height: 62px;
            }

            .side-column {
                grid-template-rows: auto;
                height: auto;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .main-title {
                font-size: 1.9rem;
            }

            .topbar {
                display: grid;
                grid-template-columns: 1fr;
            }

            .summary.active {
                display: grid;
                grid-template-columns: 1fr;
            }

            .search-row {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .farm-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 520px) {
            .resident-section .pet-card,
            .pet-card,
            .stats-grid,
            .farm-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="hero-eyebrow">HOME</div>
            <h1 class="main-title">家园查询</h1>
            <p class="desc-font">查询居住精灵、守卫状态与农场作物。</p>
        </header>

        <div class="topbar">
            <a class="btn" href="index.html">‹ 返回主页</a>
            <div class="count-pill" id="dataStatus">等待查询</div>
        </div>

        <section class="panel controls">
            <form id="searchForm" class="search-row">
                <input id="uidInput" class="search-input" type="search" inputmode="numeric" autocomplete="off" placeholder="输入玩家 UID">
                <button id="queryButton" class="btn primary-btn" type="submit">查询</button>
                <button id="clearButton" class="btn" type="button">清空</button>
            </form>
        </section>

        <div id="errorBox" class="error"></div>

        <section id="summaryPanel" class="panel summary">
            <div>
                <h2 id="homeTitle" class="home-title">-</h2>
                <div id="homeMeta" class="home-meta">UID -</div>
            </div>
        </section>

        <section id="statsGrid" class="stats-grid"></section>

        <main id="contentGrid" class="content-grid">
            <section class="panel section resident-section">
                <h2 id="residentsTitle" class="section-title">居住精灵</h2>
                <div id="residentsContent"></div>
            </section>
            <aside class="side-column">
                <section class="panel section">
                    <h2 id="guardsTitle" class="section-title">家园守卫</h2>
                    <div id="guardsContent"></div>
                </section>
                <section class="panel section">
                    <h2 id="plantsTitle" class="section-title">农场</h2>
                    <div id="plantsContent"></div>
                </section>
            </aside>
        </main>

        <section id="emptyState" class="panel empty-state">输入 UID 查询家园。</section>
    </div>

    <div class="footer-beian">
        <a href="https://beian.mps.gov.cn/#/query/webSearch?code=32058102002843" rel="noreferrer" target="_blank">
            <img src="https://img.alicdn.com/tfs/TB1..50QpXXXXX7XpXXXXXXXXXX-40-40.png" alt="" style="width: 20px; height: 20px;">
            苏公网安备32058102002843号
        </a>
    </div>

    <script>
        const UPSTREAM_ORIGIN = 'https://roco-eggs.tsuki-world.com';
        const HOME_PROXY_URL = './home_proxy.php';

        let homeData = null;
        let homeOnline = null;
        let handbookRecords = [];
        let recordByName = new Map();
        let recordByBaseName = new Map();
        let queryLoading = false;

        const uidInput = document.getElementById('uidInput');
        const searchForm = document.getElementById('searchForm');
        const queryButton = document.getElementById('queryButton');
        const clearButton = document.getElementById('clearButton');
        const dataStatus = document.getElementById('dataStatus');
        const errorBox = document.getElementById('errorBox');
        const summaryPanel = document.getElementById('summaryPanel');
        const homeTitle = document.getElementById('homeTitle');
        const homeMeta = document.getElementById('homeMeta');
        const statsGrid = document.getElementById('statsGrid');
        const contentGrid = document.getElementById('contentGrid');
        const residentsTitle = document.getElementById('residentsTitle');
        const residentsContent = document.getElementById('residentsContent');
        const guardsTitle = document.getElementById('guardsTitle');
        const guardsContent = document.getElementById('guardsContent');
        const plantsTitle = document.getElementById('plantsTitle');
        const plantsContent = document.getElementById('plantsContent');
        const emptyState = document.getElementById('emptyState');

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function normalizeUid(value) {
            const uid = String(value || '').replace(/\D/g, '');
            return /^\d{5,10}$/.test(uid) ? uid : '';
        }

        function fullAssetUrl(path) {
            if (!path) return '';
            if (/^https?:\/\//i.test(path)) return path;
            return `${UPSTREAM_ORIGIN}${path.startsWith('/') ? '' : '/'}${path}`;
        }

        function localAssetUrl(path) {
            return String(path || '').replace(/^\.\//, '');
        }

        function normalizeName(value) {
            return String(value || '').replace(/\s+/g, '').toLowerCase();
        }

        function basePetName(value) {
            return String(value || '').replace(/（[^）]*）/g, '').replace(/\([^)]*\)/g, '').trim();
        }

        function displayValue(value) {
            return value === undefined || value === null || value === '' ? '-' : value;
        }

        function formatNumber(value) {
            return value === undefined || value === null || value === '' ? '-' : Number(value).toLocaleString('zh-CN');
        }

        function secondsToText(seconds) {
            const value = Math.max(0, Math.ceil(Number(seconds) || 0));
            if (!value) return '可收获';
            const hours = Math.floor(value / 3600);
            const minutes = Math.max(hours ? 0 : 1, Math.ceil((value % 3600) / 60));
            return hours ? `${hours}时${minutes}分` : `${minutes}分`;
        }

        async function postHomeApi(action, payload) {
            const response = await fetch(`${HOME_PROXY_URL}?action=${encodeURIComponent(action)}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Accept: 'application/json',
                },
                body: JSON.stringify(payload),
            });

            const text = await response.text();
            let data = {};
            try {
                data = text ? JSON.parse(text) : {};
            } catch (error) {
                throw new Error('代理没有返回 JSON，请确认服务器已启用 PHP，并且 home_proxy.php 没有被当作静态文件返回。');
            }
            if (!response.ok) {
                throw new Error(data.detail || `代理返回 HTTP ${response.status}`);
            }
            return data;
        }

        async function loadHandbookIndex() {
            try {
                const response = await fetch('handbook_data.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                handbookRecords = Array.isArray(data.records) ? data.records : [];
                recordByName = new Map();
                recordByBaseName = new Map();
                handbookRecords.forEach(record => {
                    if (!record || !record.title) return;
                    recordByName.set(record.title, record);
                    recordByName.set(normalizeName(record.title), record);
                    const baseName = basePetName(record.title);
                    if (baseName && !recordByBaseName.has(baseName)) {
                        recordByBaseName.set(baseName, record);
                        recordByBaseName.set(normalizeName(baseName), record);
                    }
                });
            } catch (error) {
                console.warn('handbook_data.json 加载失败，家园精灵图片将使用接口图片。', error);
                handbookRecords = [];
                recordByName = new Map();
                recordByBaseName = new Map();
            }
        }

        function setError(message) {
            errorBox.style.display = message ? 'block' : 'none';
            errorBox.textContent = message || '';
        }

        function setLoading() {
            queryButton.disabled = queryLoading;
            queryButton.textContent = queryLoading ? '查询中' : '查询';
        }

        async function queryHome(refresh = false, uid = normalizeUid(uidInput.value)) {
            if (!uid) {
                setError('请输入正确的玩家 UID。');
                return;
            }

            uidInput.value = uid;
            queryLoading = true;
            setError('');
            setLoading();
            dataStatus.textContent = refresh ? '正在刷新' : '正在查询';

            try {
                const [data, online] = await Promise.all([
                    postHomeApi('query', { uid: Number(uid), refresh }),
                    postHomeApi('online-status', { uid: Number(uid) }).catch(() => null),
                ]);
                homeData = data;
                homeOnline = online;
                renderHome(online);
                localStorage.setItem('rocom_home_last_uid', uid);
            } catch (error) {
                homeData = null;
                homeOnline = null;
                renderHome(null);
                setError(error.message || '家园查询失败。');
                dataStatus.textContent = '查询失败';
            } finally {
                queryLoading = false;
                setLoading();
            }
        }

        function renderHome(online) {
            const hasData = Boolean(homeData);
            summaryPanel.classList.toggle('active', hasData);
            statsGrid.classList.toggle('active', hasData);
            contentGrid.classList.toggle('active', hasData);
            emptyState.style.display = hasData ? 'none' : 'block';

            if (!hasData) {
                statsGrid.innerHTML = '';
                residentsContent.innerHTML = '';
                guardsContent.innerHTML = '';
                plantsContent.innerHTML = '';
                return;
            }

            const home = homeData.home || {};
            homeTitle.textContent = `账号昵称：${home.name || '-'}`;
            homeMeta.textContent = `UID：${homeData.uid} · 在线状态：${online && online.status ? (online.status === 'online' ? '在线' : '离线') : '未知'}`;
            dataStatus.textContent = homeData.cached ? '已载入缓存' : '已同步';
            renderStats();
            renderSections();
        }

        function renderStats() {
            const home = homeData.home || {};
            const pets = [...(homeData.residents || []), ...(homeData.guards || [])];
            const eggs = pets.filter(pet => pet.hasEgg).length;
            const inspiration = pets.filter(pet => pet.feedStatus === '可收集').length;
            const ripe = (homeData.plants || []).filter(plant => plant.ripeAt && Number(plant.ripeAt) * 1000 <= Date.now()).length;
            const items = [
                ['家园等级', home.level],
                ['舒适度', formatNumber(home.comfort)],
                ['居住精灵', (homeData.residents || []).length],
                ['可收取蛋', eggs],
                ['可收集灵感', inspiration],
                ['可收获植物', ripe],
            ];

            statsGrid.innerHTML = items.map(([label, value]) => `
                <article class="stat-card">
                    <div class="stat-label">${escapeHtml(label)}</div>
                    <div class="stat-value">${escapeHtml(displayValue(value))}</div>
                </article>
            `).join('');
        }

        function renderSections() {
            if (!homeData) return;
            residentsTitle.textContent = `居住精灵 ${(homeData.residents || []).length}`;
            guardsTitle.textContent = `家园守卫 ${(homeData.guards || []).length}`;
            plantsTitle.textContent = `农场 ${(homeData.plants || []).length}`;
            residentsContent.innerHTML = renderPets(homeData.residents || [], { smallImage: true });
            guardsContent.innerHTML = renderPets(homeData.guards || [], { compact: true, hideSub: true });
            plantsContent.innerHTML = renderPlants(homeData.plants || []);
        }

        function renderPets(pets, options = {}) {
            if (!pets.length) return '<div class="empty-state">暂无资料。</div>';
            return `<div class="pet-grid">${pets.map(pet => renderPetCard(pet, options)).join('')}</div>`;
        }

        function petRecord(pet) {
            const names = [pet.name, pet.defaultName, pet.speciesName].filter(Boolean);
            for (const name of names) {
                const exact = recordByName.get(name);
                if (exact) return exact;
                const normalized = recordByName.get(normalizeName(name));
                if (normalized) return normalized;
            }
            for (const name of names) {
                const baseExact = recordByBaseName.get(name);
                if (baseExact) return baseExact;
                const baseNormalized = recordByBaseName.get(normalizeName(name));
                if (baseNormalized) return baseNormalized;
            }
            for (const name of names) {
                const normalizedName = normalizeName(name);
                const fuzzy = handbookRecords.find(record => {
                    const title = normalizeName(record && record.title);
                    const baseTitle = normalizeName(basePetName(record && record.title));
                    return title.startsWith(normalizedName) || baseTitle.includes(normalizedName);
                });
                if (fuzzy) return fuzzy;
            }
            return null;
        }

        function isRarePet(pet) {
            return String(pet.mutation || '').includes('异色');
        }

        function petImagePath(pet, options = {}) {
            const record = petRecord(pet);
            if (record) {
                if (isRarePet(pet)) {
                    return localAssetUrl(toSmallPortraitPath(record.rarePath || inferRarePath(record.portrait) || record.portrait, options.smallImage));
                }
                return localAssetUrl(toSmallPortraitPath(record.portrait, options.smallImage) || record.icon);
            }
            return fullAssetUrl(pet.image);
        }

        function inferRarePath(path) {
            return path ? String(path).replace(/-portrait\.png$/, '异色-portrait.png') : '';
        }

        function toSmallPortraitPath(path, useSmall) {
            if (!useSmall || !path) return path || '';
            return String(path).replace('sprite_imgs/portrait/', 'sprite_imgs/portrait-small/');
        }

        function genderSymbol(gender) {
            const value = String(gender || '');
            if (value.includes('雄') || value.toLowerCase().includes('male')) {
                return '<span class="gender-symbol gender-male" title="雄性">♂</span>';
            }
            if (value.includes('雌') || value.toLowerCase().includes('female')) {
                return '<span class="gender-symbol gender-female" title="雌性">♀</span>';
            }
            return '';
        }

        function mutationBadge(pet) {
            const mutation = String(pet.mutation || '');
            if (mutation === '异色炫彩') {
                return `<img class="mutation-badge" src="./web_images/rareshine.png" alt="异色炫彩" title="异色炫彩" onerror="this.style.display='none'">`;
            }
            if (mutation === '异色') {
                return `<img class="mutation-badge" src="./web_images/rare.png" alt="异色" title="异色" onerror="this.style.display='none'">`;
            }
            return '';
        }

        function typeLogoPath(name) {
            return `./web_images/types/${encodeURIComponent(name)}.png`;
        }

        function feedStatusText(status) {
            return status === '可收集' ? '可收集灵感' : status;
        }

        function renderPetCard(pet, options = {}) {
            const title = pet.nickname && pet.nickname !== pet.defaultName
                ? `${pet.defaultName || pet.name}（${pet.nickname}）`
                : pet.name || pet.defaultName || '-';
            const attrs = Array.isArray(pet.attrs) ? pet.attrs : [];
            const eggGroups = Array.isArray(pet.eggGroups) ? pet.eggGroups : [];
            const normalStatus = pet.feedStatus && pet.feedStatus !== '可收集' ? feedStatusText(pet.feedStatus) : '';
            const sub = options.hideSub ? '' : [normalStatus].filter(Boolean).join(' · ');

            return `
                <article class="pet-card">
                    <div class="pet-image-wrap">
                        ${mutationBadge(pet)}
                        <img class="pet-image" src="${escapeHtml(petImagePath(pet, options))}" data-fallback="${escapeHtml(fullAssetUrl(pet.image))}" alt="${escapeHtml(title)}" loading="lazy" onerror="useImageFallback(this)">
                    </div>
                    <div>
                        <div class="pet-name-row">
                            <div class="pet-name">${escapeHtml(title)}</div>
                            <div class="pet-mini-meta">
                                ${pet.level ? `<span>Lv.${escapeHtml(pet.level)}</span>` : ''}
                                ${genderSymbol(pet.gender)}
                            </div>
                        </div>
                        ${sub ? `<div class="pet-sub">${escapeHtml(sub)}</div>` : ''}
                        <div class="chips">
                            ${attrs.map(attr => `
                                <span class="chip type-logo-chip" title="${escapeHtml(attr.name)}">
                                    <img src="${escapeHtml(typeLogoPath(attr.name))}" alt="${escapeHtml(attr.name)}" onerror="this.style.display='none'">
                                </span>
                            `).join('')}
                            ${eggGroups.map(group => `<span class="chip egg-group-chip">${escapeHtml(group)}</span>`).join('')}
                            ${pet.feedStatus === '可收集' ? '<span class="chip alert-chip">可收集灵感</span>' : ''}
                            ${pet.hasEgg ? '<span class="chip alert-chip">可收取蛋</span>' : ''}
                        </div>
                    </div>
                </article>
            `;
        }

        function useImageFallback(image) {
            const fallback = image.dataset.fallback;
            if (fallback && image.src !== fallback) {
                image.src = fallback;
                image.dataset.fallback = '';
                return;
            }
            image.style.display = 'none';
        }

        function renderPlants(plants) {
            if (!plants.length) return '<div class="empty-state">暂无农场资料。</div>';
            const byPlot = new Map(plants.map(plant => [Number(plant.plot), plant]));
            const slots = Array.from({ length: 15 }, (_, index) => byPlot.get(index + 1) || { plot: index + 1, name: '空地' });
            return `
                <div class="farm-grid">
                    ${slots.map(plant => {
                        const ripe = plant.ripeAt && Number(plant.ripeAt) * 1000 <= Date.now();
                        const remaining = plant.ripeAt ? Math.ceil(Number(plant.ripeAt) - Date.now() / 1000) : plant.remainingSeconds;
                        return `
                            <article class="plant-card ${ripe ? 'ripe' : ''}">
                                ${plant.seedId ? `<img class="plant-image" src="${escapeHtml(farmImagePath(plant))}" data-fallback="${escapeHtml(fullAssetUrl(plant.image))}" alt="${escapeHtml(plant.name)}" loading="lazy" onerror="useImageFallback(this)">` : '<div class="plant-image"></div>'}
                                <div class="plant-name">${escapeHtml(plant.name || '空地')}</div>
                                <div class="plant-status ${ripe ? 'ripe-text' : ''}">${escapeHtml(plant.seedId ? (ripe ? '可收获' : secondsToText(remaining)) : `地块 ${plant.plot}`)}</div>
                            </article>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function farmImagePath(plant) {
            return plant && plant.name
                ? `./web_images/farm/${encodeURIComponent(plant.name)}.png`
                : '';
        }

        searchForm.addEventListener('submit', event => {
            event.preventDefault();
            queryHome(false);
        });

        uidInput.addEventListener('input', () => {
            uidInput.value = uidInput.value.replace(/\D/g, '');
        });

        clearButton.addEventListener('click', () => {
            uidInput.value = '';
            homeData = null;
            homeOnline = null;
            dataStatus.textContent = '等待查询';
            setError('');
            renderHome(null);
            uidInput.focus();
        });

        async function init() {
            setLoading();
            const params = new URLSearchParams(location.search);
            const urlUid = normalizeUid(params.get('uid'));
            const uid = urlUid || normalizeUid(localStorage.getItem('rocom_home_last_uid'));
            if (uid) uidInput.value = uid;
            if (urlUid) queryHome(false, urlUid);
            loadHandbookIndex().then(() => {
                if (homeData) renderHome(homeOnline);
            });
        }

        init();
    </script>

        var bp = document.createElement('script');
        bp.src = '//push.zhanzhang.baidu.com/push.js';
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(bp, s);
    })();
    </script>
</body>
