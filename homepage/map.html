<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="洛克王国世界地图，查询卡洛西亚大陆、魔法学院、地下图层和探索点位。">
    <title>世界地图 - 洛克王国世界工具站</title>
    <link rel="stylesheet" href="./src/tools/map.css">
</head>
<body>
    <main class="map-shell">
        <aside class="panel filter-panel" id="mapFilters" aria-label="地图筛选">
            <div class="map-side-heading">
                <div>
                    <h2 class="panel-title">地图筛选</h2>
                    <p class="map-summary" id="mapSummary" role="status"></p>
                </div>
                <button id="foldFilterButton" type="button" aria-controls="mapFilters" aria-expanded="true">收起</button>
            </div>

            <div class="map-filter-scroll">
                <div class="map-selectors">
                    <div class="map-field">
                        <label for="mapSelect">地图</label>
                        <select id="mapSelect"></select>
                    </div>
                    <div class="map-field">
                        <label for="floorSelect">图层</label>
                        <select id="floorSelect"></select>
                    </div>
                </div>
                <div class="map-field">
                    <label for="mapSearch">搜索点位</label>
                    <input id="mapSearch" type="search" autocomplete="off" placeholder="输入地名、精灵或点位名称">
                </div>
                <div class="map-search-results" id="mapSearchResults" aria-label="搜索结果" hidden></div>

                <div class="map-presets" id="mapPresets" aria-label="常用筛选"></div>
                <div class="map-filter-actions">
                    <button id="showAllButton" type="button">全部显示</button>
                    <button id="hideAllButton" type="button">全部隐藏</button>
                    <button id="resetFiltersButton" type="button">恢复默认</button>
                    <label class="map-collection-filter"><input id="hideCollected" type="checkbox"> 隐藏已收集</label>
                </div>
                <div id="groupList" class="map-group-list"></div>
            </div>

            <p class="map-source">
                地图资料来自 <a href="https://wiki.biligame.com/nrc/地图" target="_blank" rel="noopener noreferrer">洛克王国世界 WIKI</a> 及贡献者。
                数据经整理并按 <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.zh-hans" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a> 发布。
            </p>
        </aside>

        <section class="map-viewport" id="mapViewport" tabindex="0" aria-label="互动地图，方向键移动，加减键缩放">
            <canvas id="mapCanvas" aria-label="世界地图">可通过点位搜索查询地图资料。</canvas>
            <button class="map-restore" id="restoreFilterButton" type="button" aria-controls="mapFilters" aria-expanded="false" hidden>展开筛选</button>
            <div class="map-tools" aria-label="地图缩放">
                <button id="zoomInButton" type="button" aria-label="放大地图">+</button>
                <button id="zoomOutButton" type="button" aria-label="缩小地图">−</button>
                <button id="fitMapButton" type="button" aria-label="回到全图">全图</button>
            </div>
            <div class="map-status">
                <span id="mapRegion"></span>
                <span id="visibleCount">视野内 0 个点位</span>
                <span id="mapZoom">100%</span>
            </div>
            <div class="map-loading" id="mapLoading" role="status">
                <span id="mapLoadingText">正在加载地图资料…</span>
                <button id="mapRetry" type="button" hidden>重试</button>
            </div>
            <aside class="panel location-popup" id="mapDetails" aria-label="点位详情" hidden>
                <div class="map-detail-toolbar">
                    <button id="closeMapDetails" type="button" aria-label="关闭点位详情">关闭</button>
                </div>
                <div id="mapDetailContent"></div>
            </aside>
        </section>
    </main>
    <script type="module" src="./src/tools/map.js"></script>
</body>
</html>
